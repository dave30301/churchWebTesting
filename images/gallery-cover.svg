<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" role="img" aria-label="Collage of church photographs: a church at dusk, people gathered together, and a stained-glass window">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B1735"/><stop offset="1" stop-color="#4B1026"/></linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F3EC"/><stop offset="0.55" stop-color="#E9D3A4"/><stop offset="1" stop-color="#C9A55C"/></linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9A55C"/><stop offset="0.6" stop-color="#EBD9AE"/><stop offset="1" stop-color="#F7F3EC"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#F7F3EC" stop-opacity="0.95"/><stop offset="1" stop-color="#C9A55C" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.35"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/></filter>
    <clipPath id="photo"><rect x="0" y="0" width="360" height="440" rx="6"/></clipPath>
    <g id="aperture">
      <circle r="150" fill="none" stroke="#C9A55C" stroke-width="2"/><circle r="110" fill="none" stroke="#C9A55C" stroke-width="2"/>
      <g stroke="#C9A55C" stroke-width="2" fill="none">
        <path d="M0,-110 L95,-55 M95,-55 L95,55 M95,55 L0,110 M0,110 L-95,55 M-95,55 L-95,-55 M-95,-55 L0,-110"/>
        <path d="M0,-110 L-48,-30 M95,-55 L48,-30 M95,55 L40,38 M0,110 L48,30 M-95,55 L-40,38 M-95,-55 L-40,-30"/>
      </g>
    </g>
  </defs>

  <rect width="1400" height="800" fill="url(#bg)"/>
  <use href="#aperture" transform="translate(1180,170) scale(1.7)" opacity="0.16"/>
  <use href="#aperture" transform="translate(120,700) scale(1.2)" opacity="0.14"/>
  <g fill="#C9A55C">
    <circle cx="150" cy="120" r="7" opacity="0.35"/><circle cx="260" cy="60" r="4" opacity="0.4"/><circle cx="1260" cy="620" r="9" opacity="0.3"/>
    <circle cx="1330" cy="440" r="5" opacity="0.4"/><circle cx="60" cy="410" r="6" opacity="0.3"/><circle cx="1100" cy="740" r="4" opacity="0.4"/>
    <circle cx="560" cy="60" r="5" opacity="0.3"/><circle cx="880" cy="745" r="6" opacity="0.3"/>
  </g>

  <!-- Print A: church at dusk (left) -->
  <g transform="translate(330,410) rotate(-9) translate(-180,-232)" filter="url(#shadow)">
    <rect x="-16" y="-16" width="392" height="508" rx="10" fill="#F7F3EC"/>
    <g clip-path="url(#photo)">
      <rect width="360" height="440" fill="url(#dusk)"/>
      <circle cx="262" cy="190" r="110" fill="url(#glow)"/><circle cx="262" cy="190" r="38" fill="#F7F3EC"/>
      <path d="M0,360 Q90,320 180,350 T360,335 V440 H0Z" fill="#6B1735" opacity="0.85"/>
      <rect x="165" y="196" width="30" height="86" fill="#4B1026"/><path d="M158,198 L180,128 L202,198Z" fill="#4B1026"/>
      <path d="M180,128 V104 M170,114 H190" stroke="#C9A55C" stroke-width="4" stroke-linecap="round"/>
      <rect x="168" y="214" width="24" height="3" fill="#C9A55C" opacity="0.0"/>
      <path d="M172,226 a8,10 0 0 1 16,0 v18 h-16Z" fill="#C9A55C"/>
      <path d="M86,290 L180,262 L274,290 V386 H86Z" fill="#4B1026"/>
      <path d="M72,292 L180,252 L288,292 L288,300 L180,262 L72,300Z" fill="#6B1735"/>
      <g fill="#C9A55C"><path d="M110,320 a9,14 0 0 1 18,0 v26 h-18Z"/><path d="M232,320 a9,14 0 0 1 18,0 v26 h-18Z"/></g>
      <path d="M160,386 v-44 a20,22 0 0 1 40,0 v44Z" fill="#F7F3EC" opacity="0.9"/>
      <rect y="386" width="360" height="54" fill="#4B1026"/>
      <path d="M150,386 L110,440 H250 L210,386Z" fill="#C9A55C" opacity="0.35"/>
    </g>
  </g>

  <!-- Print C: stained glass (right) -->
  <g transform="translate(1070,410) rotate(9) translate(-180,-232)" filter="url(#shadow)">
    <rect x="-16" y="-16" width="392" height="508" rx="10" fill="#F7F3EC"/>
    <g clip-path="url(#photo)">
      <rect width="360" height="440" fill="#4B1026"/>
      <g fill="#C9A55C" opacity="0.18"><path d="M180,200 L-40,-20 L40,-40Z"/><path d="M180,200 L400,-20 L320,-40Z"/><path d="M180,200 L-60,200 L-60,120Z"/><path d="M180,200 L420,200 L420,120Z"/><path d="M180,200 L120,-60 L240,-60Z"/></g>
      <path d="M70,420 V190 a110,150 0 0 1 220,0 V420Z" fill="#6B1735" stroke="#C9A55C" stroke-width="6"/>
      <path d="M92,420 V196 a88,128 0 0 1 176,0 V420Z" fill="#4B1026" stroke="#C9A55C" stroke-width="2"/>
      <g fill="#C9A55C"><rect x="168" y="120" width="24" height="170" rx="3"/><rect x="128" y="168" width="104" height="24" rx="3"/></g>
      <circle cx="180" cy="180" r="62" fill="url(#glow)" opacity="0.7"/>
      <g opacity="0.95">
        <rect x="106" y="316" width="62" height="46" fill="#C9A55C"/><rect x="192" y="316" width="62" height="46" fill="#F7F3EC"/>
        <rect x="106" y="366" width="62" height="46" fill="#F7F3EC"/><rect x="192" y="366" width="62" height="46" fill="#C9A55C"/>
        <rect x="106" y="256" width="40" height="52" fill="#6B1735"/><rect x="214" y="256" width="40" height="52" fill="#6B1735"/>
      </g>
      <g stroke="#4B1026" stroke-width="3" fill="none"><path d="M180,310 V420 M92,364 H268"/></g>
    </g>
  </g>

  <!-- Print B: people gathered (center, on top) -->
  <g transform="translate(700,396) rotate(-2) scale(1.04) translate(-180,-232)" filter="url(#shadow)">
    <rect x="-16" y="-16" width="392" height="508" rx="10" fill="#F7F3EC"/>
    <g clip-path="url(#photo)">
      <rect width="360" height="440" fill="url(#dawn)"/>
      <circle cx="180" cy="210" r="150" fill="url(#glow)"/>
      <circle cx="180" cy="196" r="46" fill="#F7F3EC"/>
      <path d="M0,330 Q100,290 190,322 T360,300 V440 H0Z" fill="#C9A55C"/>
      <path d="M0,372 Q120,340 230,368 T360,356 V440 H0Z" fill="#6B1735"/>
      <g fill="#4B1026" stroke="#4B1026" stroke-linecap="round">
        <g><circle cx="58" cy="318" r="15"/><path d="M58,332 c-20,0 -26,24 -26,56 v52 h52 v-52 c0,-32 -6,-56 -26,-56Z" stroke="none"/></g>
        <g><circle cx="318" cy="324" r="14"/><path d="M318,337 c-19,0 -25,22 -25,52 v51 h50 v-51 c0,-30 -6,-52 -25,-52Z" stroke="none"/></g>
      </g>
      <g fill="#6B1735">
        <circle cx="116" cy="296" r="17"/><path d="M116,312 c-23,0 -30,28 -30,64 v64 h60 v-64 c0,-36 -7,-64 -30,-64Z"/>
        <circle cx="244" cy="300" r="17"/><path d="M244,316 c-23,0 -30,26 -30,62 v62 h60 v-62 c0,-36 -7,-62 -30,-62Z"/>
      </g>
      <g stroke="#6B1735" stroke-width="9" stroke-linecap="round" fill="none"><path d="M92,336 L72,288"/><path d="M268,338 L290,292"/></g>
      <g fill="#4B1026">
        <circle cx="180" cy="286" r="19"/><path d="M180,305 c-27,0 -35,30 -35,70 v65 h70 v-65 c0,-40 -8,-70 -35,-70Z"/>
      </g>
      <g stroke="#4B1026" stroke-width="10" stroke-linecap="round" fill="none"><path d="M152,328 L124,272"/><path d="M208,328 L236,272"/></g>
    </g>
  </g>

  <rect width="1400" height="800" fill="url(#vig)"/>
</svg>
